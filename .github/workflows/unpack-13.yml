name: Extract Project Files

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Unzip 13@a.zip at repo root
        run: unzip -o "13@a.zip"

      - name: Verify extracted project files
        run: ls -la package.json src/App.tsx

      - name: Commit and push extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Extract 13@a.zip project files" || echo "No changes to commit"
          git push
